version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: callreports_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: callreports
      MYSQL_USER: calluser
      MYSQL_PASSWORD: callpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "calluser", "-pcallpass"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: callreports_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "mysql+pymysql://calluser:callpass@mysql:3306/callreports"
      WATCHED_FOLDER: "/app/watched_folder"
    ports:
      - "8000:8000"
    volumes:
      - ./watched_folder:/app/watched_folder
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: callreports_web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  mysql_data:
